<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Spotify — návrat</title>
<style>
  body { margin:0; display:grid; place-items:center; min-height:100vh;
         background:#0A0A0C; color:#E9E9EE;
         font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  p { opacity:.7; max-width:36ch; text-align:center }
</style>
</head>
<body>
<p>Předávám přihlášení aplikaci…</p>
<script>
  /*
   * Návrat z přihlášení ke Spotify.
   *
   * Nic tu nerozhoduje: jen podá dál kód a `state`, se kterými se prohlížeč
   * vrátil. Kontroluje je aplikace, která si `state` vygenerovala; podstrčit
   * se sem nedá nic, protože cizí `state` aplikace ignoruje.
   *
   * Dvě cesty jako u TONE3000: `BroadcastChannel`, protože `COOP:
   * same-origin` okno od aplikace odstřihne, a `opener` pro prohlížeče,
   * které vazbu zachovají.
   */
  var zprava = { typ: 'spotify-navrat', hledani: window.location.search };
  var predano = false;
  try {
    if (window.opener) {
      window.opener.postMessage(zprava, window.location.origin);
      predano = true;
    }
  } catch (e) { /* odstřižené okno — zkusí se kanál */ }
  try {
    var kanal = new BroadcastChannel('neverlast-oauth-navrat');
    kanal.postMessage(zprava);
    kanal.close();
    predano = true;
  } catch (e) { /* bez BroadcastChannel zbyde jen opener */ }

  document.querySelector('p').textContent = predano
    ? 'Hotovo — vrať se do aplikace. Okno se zavře samo, jinak ho zavři.'
    : 'Návrat se nepodařilo předat. Zavři okno a zkus přihlášení znovu.';
  setTimeout(function () { window.close(); }, 300);
</script>
</body>
</html>
